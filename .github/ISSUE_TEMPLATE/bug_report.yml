name: Bug report
description: Report a problem with sphinx-autoapi.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. We can only fix what we can reproduce,
        so please include a way to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest source code, `conf.py` settings and commands that show
        the problem. A link to a minimal repository also works.
      placeholder: |
        conf.py:
        ```python
        extensions = ["autoapi.extension"]
        autoapi_dirs = ["../src"]
        ```

        src/example.py:
        ```python
        def example(): ...
        ```

        Command: `sphinx-build -b html docs docs/_build`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any error output or warnings.
    validations:
      required: true
  - type: input
    id: autoapi-version
    attributes:
      label: sphinx-autoapi version
    validations:
      required: true
  - type: input
    id: sphinx-version
    attributes:
      label: Sphinx version
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true
